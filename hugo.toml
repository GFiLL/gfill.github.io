baseURL = 'https://gfill.github.io/'
languageCode = 'en-us'
title = 'Guillem Foucault'
theme = 'gruvhugo'


#paginate = "10" # Number of posts per page

# enable shortcodes like css.inline
enableInlineShortcodes = true

# automatically updates last modified based on git
enableGitInfo = true


[frontmatter]
  lastmod = ['lastmod', ':git', 'date', 'publishDate']


# from gruvhugo
[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"


[params]
  googleAnalytics = "G-YHML90KBB6"

[params.style]
  custom_scss = ["css/custom.scss"]

[params.main]
  enabled = true
  enableKatex = true
  headerTitle = "Guillem Foucault"
  name = "guillem_foucault"
 description = '''
  I am a PhD candidate on the job market at the <b>Toulouse School of Economics</b>, under the supervision of Prof. <a href="https://sites.google.com/view/olivierdegroote">Olivier De Groote</a> and Prof. <a href="https://matteobobba.github.io">Matteo Bobba</a>. I am also an affiliate of the <a href="https://www.tse-fr.eu/human-capital-center">TSE Human Capital Center</a>.<br><br>

  <b>Fields:</b> Labor Economics, Applied Microeconomics, Education Economics<br><br>

  My research models the dynamic consequences of human capital decisions, combining causal methods with structural modelling for ex ante policy evaluation. Don't hesitate to reach out at <a href="mailto:guillem.foucault@tse-fr.eu">guillem.foucault@tse-fr.eu</a>. You can find my resume <a href="/resume.pdf" target="_blank">here</a>.
  <br><br> 
  
  <b>References:</b>
  <a href="https://matteobobba.github.io">Matteo Bobba</a>,
  <a href="https://sites.google.com/view/olivierdegroote">Olivier De Groote</a>,
  <a href="https://sites.google.com/site/amgazmuri/home">Ana Gazmuri</a>,
  <a href="https://sites.google.com/site/francoispoinas">François Poinas</a>
  <br><br>  


  '''
  licenseUrl = ""
 # homeContent = "content/_index"  # Add this line to specify the about page content for the home page
img = "images/profile2026.jpg"
copyright = "&copy; 2026 Guillem Foucault"

